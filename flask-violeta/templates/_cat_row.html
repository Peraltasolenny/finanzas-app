<div class="d-flex justify-content-between align-items-center py-2 border-bottom">
  <span class="{{ '' if c.is_active else 'text-decoration-line-through text-muted' }}">{{ c.name }}</span>
  <form method="post" action="{{ url_for('main.toggle_category', cat_id=c.id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button class="btn btn-sm {{ 'btn-outline-secondary' if c.is_active else 'btn-outline-success' }}">
      {{ 'Ocultar' if c.is_active else 'Activar' }}
    </button>
  </form>
</div>
