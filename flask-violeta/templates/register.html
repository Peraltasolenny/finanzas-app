{% extends "base.html" %}
{% block title %}Crear cuenta{% endblock %}
{% block content %}
<div class="card auth-card shadow-sm">
  <div class="card-body p-4 p-md-5">
    <div class="text-center mb-4">
      <div class="brand-mark" style="background:linear-gradient(140deg,var(--fin-accent),var(--fin-accent-2));color:var(--fin-accent-ink);">$</div>
      <h3 class="mt-2 mb-1 page-title">Finanzas</h3>
      <p class="text-muted small mb-0">Crea tu cuenta (solo la primera vez)</p>
    </div>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" name="name" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label">Correo</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control" required>
        <div class="form-text">Mínimo 8 caracteres.</div>
      </div>
      <div class="mb-4">
        <label class="form-label">Repite la contraseña</label>
        <input type="password" name="password2" class="form-control" required>
      </div>
      <button class="btn btn-dark w-100">Crear cuenta</button>
    </form>
  </div>
</div>
{% endblock %}
