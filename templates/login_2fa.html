{% extends "base.html" %}
{% block title %}Verificación en dos pasos{% endblock %}
{% block content %}
<div class="card auth-card shadow-sm">
  <div class="card-body p-4 p-md-5">
    <div class="text-center mb-4">
      <div class="brand-mark" style="background:linear-gradient(140deg,var(--fin-accent),var(--fin-accent-2));color:var(--fin-accent-ink);">🔒</div>
      <h3 class="mt-2 mb-1 page-title">Verificación en dos pasos</h3>
      <p class="text-muted small mb-0">Ingresa el código de 6 dígitos de tu app de autenticación</p>
    </div>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-4">
        <input type="text" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="6"
               class="form-control form-control-lg text-center" placeholder="000000" required autofocus>
      </div>
      <button class="btn btn-dark w-100">Verificar</button>
    </form>
    <p class="text-center mt-3 mb-0"><a href="{{ url_for('auth.login') }}" class="small text-muted">Cancelar</a></p>
  </div>
</div>
{% endblock %}
