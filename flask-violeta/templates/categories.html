{% extends "base.html" %}
{% block title %}Categorías{% endblock %}
{% block content %}
<h4 class="mb-4 page-title">Categorías</h4>
<div class="row g-3">
  <div class="col-lg-4">
    <div class="card shadow-sm"><div class="card-body">
      <h5 class="card-title mb-3">Agregar categoría</h5>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-2">
          <label class="form-label small">Nombre</label>
          <input type="text" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label small">Tipo</label>
          <select name="type" class="form-select">
            <option value="expense">Gasto</option>
            <option value="income">Ingreso</option>
          </select>
        </div>
        <button class="btn btn-dark w-100">Agregar</button>
      </form>
    </div></div>
  </div>

  <div class="col-lg-4">
    <div class="card shadow-sm"><div class="card-body">
      <h5 class="card-title text-success mb-3">Ingresos</h5>
      {% for c in ingresos %}{% include "_cat_row.html" %}{% endfor %}
    </div></div>
  </div>
  <div class="col-lg-4">
    <div class="card shadow-sm"><div class="card-body">
      <h5 class="card-title text-danger mb-3">Gastos</h5>
      {% for c in gastos %}{% include "_cat_row.html" %}{% endfor %}
    </div></div>
  </div>
</div>
{% endblock %}
