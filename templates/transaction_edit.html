{% extends "base.html" %}
{% block title %}Editar transacción{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <h4 class="mb-3 page-title">Editar transacción</h4>
    {% if tx.recurring_rule_id %}
      <div class="alert alert-info small">Esta transacción vino de una regla recurrente 🔁. Editarla aquí <strong>no afecta</strong> la regla ni las demás ocurrencias.</div>
    {% endif %}
    <div class="card shadow-sm"><div class="card-body">
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-2"><label class="form-label small">Tipo</label>
          <select name="type" class="form-select">
            <option value="expense" {{ 'selected' if tx.type=='expense' }}>Gasto</option>
            <option value="income" {{ 'selected' if tx.type=='income' }}>Ingreso</option>
          </select></div>
        <div class="mb-2"><label class="form-label small">Categoría</label>
          <select name="category_id" class="form-select">
            <option value="">(sin categoría)</option>
            {% for c in categorias %}<option value="{{ c.id }}" {{ 'selected' if tx.category_id==c.id }}>{{ c.name }}</option>{% endfor %}
          </select></div>
        <div class="mb-2"><label class="form-label small">Cuenta / banco</label>
          <select name="account_id" class="form-select">
            <option value="">(ninguna)</option>
            {% for a in accounts %}<option value="{{ a.id }}" {{ 'selected' if tx.account_id==a.id }}>{{ a.name }}{% if a.bank %} — {{ a.bank }}{% endif %}</option>{% endfor %}
          </select></div>
        <div class="row g-2">
          <div class="col-7"><label class="form-label small">Monto</label>
            <input type="number" step="0.01" min="0" name="amount" value="{{ '%.2f'|format(tx.amount) }}" class="form-control" required></div>
          <div class="col-5"><label class="form-label small">Moneda</label>
            <input type="text" name="currency" value="{{ tx.currency or base }}" class="form-control"></div>
        </div>
        <div class="mb-2 mt-2"><label class="form-label small">Grupo (salud financiera)</label>
          <select name="bucket" class="form-select">
            <option value="">(usar el de la categoría)</option>
            <option value="need" {{ 'selected' if tx.bucket=='need' }}>Necesidad</option>
            <option value="want" {{ 'selected' if tx.bucket=='want' }}>Gusto</option>
            <option value="invest" {{ 'selected' if tx.bucket=='invest' }}>Inversión</option>
          </select></div>
        <div class="mb-2"><label class="form-label small">Fecha</label>
          <input type="date" name="tx_date" value="{{ tx.tx_date.isoformat() }}" class="form-control" required></div>
        <div class="mb-3"><label class="form-label small">Descripción</label>
          <input type="text" name="description" value="{{ tx.description }}" class="form-control"></div>
        <div class="d-flex gap-2">
          <button class="btn btn-dark">Guardar cambios</button>
          <a class="btn btn-outline-secondary" href="{{ url_for('main.transactions', year=tx.tx_date.year, month=tx.tx_date.month) }}">Cancelar</a>
        </div>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
